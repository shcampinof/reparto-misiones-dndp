name: Publicar frontend en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar lint y formato
        run: npm run lint && npm run format:check
      - name: Validar backend público
        run: |
          if [[ -z "$VITE_API_URL" || "$VITE_API_URL" != https://* ]]; then
            echo "Configure la variable VITE_API_URL con la base HTTPS de la API pública, incluida la ruta /api."
            exit 1
          fi
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Compilar frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Cargar sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
